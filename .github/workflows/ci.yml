name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Um push novo cancela o anterior no mesmo branch: não faz sentido gastar
  # runner terminando o build de um commit que já foi substituído.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Os testes rodam contra PostgreSQL de verdade, não SQLite: o schema
        # depende de jsonb e índices GIN (ADR 0003).
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbital_test
          POSTGRES_USER: orbital
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbital"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, redis, zip, intl, bcmath, gd
          coverage: none

      - name: Habilitar extensões do PostgreSQL
        run: |
          PGPASSWORD=secret psql -h localhost -U orbital -d orbital_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent; CREATE EXTENSION IF NOT EXISTS citext;'

      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api

      - name: Preparar ambiente
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: orbital_test
          DB_USERNAME: orbital
          DB_PASSWORD: secret
        run: php artisan test

      - name: Formatação (Pint)
        working-directory: apps/api
        run: vendor/bin/pint --test

  web:
    name: Frontend (tipos e simulação)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        working-directory: apps/web

      # O script roda `next typegen` antes do tsc. `next-env.d.ts` e
      # `.next/types` são gerados pelo Next e não versionados; sem eles o
      # TypeScript não conhece os imports de imagem nem os tipos de rota.
      - name: Tipos
        working-directory: apps/web
        run: npm run typecheck

      - name: Física dos módulos
        working-directory: apps/web
        run: npm run test

      - name: Lint
        working-directory: apps/web
        run: npm run lint

  images:
    name: Publicar imagens (GHCR)
    # Só publica o que passou nos testes, e só a partir do main.
    needs: [api, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # É esta permissão que dispensa qualquer token pessoal: o GITHUB_TOKEN
      # do próprio job publica no GHCR.
      packages: write

    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/php/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: nginx
            dockerfile: docker/nginx/Dockerfile.prod

    steps:
      - uses: actions/checkout@v4

      # `github.repository_owner` preserva a capitalização da conta, e o
      # registry recusa maiúsculas no nome. Normalizamos aqui em vez de fixar
      # o nome no arquivo, para o workflow continuar válido em um fork.
      - name: Normalizar o dono do repositório
        id: owner
        run: echo "slug=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.slug }}/orbital-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.slug }}/orbital-${{ matrix.name }}:${{ github.sha }}
          # Cache no próprio GHA: sem isso cada build refaz composer install e
          # npm ci do zero, e o job passa de minutos a dezenas de minutos.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
