name: orbital

services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PHP_IDE_CONFIG: serverName=orbital

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8100}:80"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-orbital}
      POSTGRES_USER: ${DB_USERNAME:-orbital}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Ordenação determinística: relatórios científicos não podem mudar
      # de ordem porque a locale do host mudou.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pt-BR --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-orbital} -d ${DB_DATABASE:-orbital}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data

  # Servidor SMTP de mentira: captura tudo que a aplicação envia e mostra numa
  # interface web, com o HTML renderizado e a fonte da mensagem. Nada sai da
  # máquina — em desenvolvimento, um endereço errado num teste não pode virar
  # e-mail de verdade para um estranho.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8125}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data

  web:
    image: node:24-alpine
    working_dir: /app
    # -H 0.0.0.0: sem isso o dev server escuta só dentro do container e a porta
    # publicada não responde.
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - ./apps/web:/app
      - ./packages:/packages
    environment:
      # No browser o Next expõe seus próprios route handlers (BFF);
      # server-side ele fala com o nginx pela rede interna do Compose.
      API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3100}
      WATCHPACK_POLLING: "false"
    depends_on:
      - nginx

volumes:
  pgdata:
  redisdata:
  mailpitdata:
