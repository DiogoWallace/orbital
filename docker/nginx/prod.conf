server {
    listen 80;
    server_name _;

    # Volume alimentado pelo entrypoint da API — ver docker/php/entrypoint.prod.sh
    root /srv/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # O Caddy é a borda e já cuida de HSTS e TLS; aqui ficam apenas os
    # cabeçalhos que dependem da resposta da aplicação.
    add_header X-Content-Type-Options "nosniff" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Caminho ABSOLUTO DENTRO DO CONTAINER DA API, não deste.
        # Usar $realpath_root aqui apontaria para /srv/public, que não existe do
        # lado do PHP — é o erro clássico de php-fpm em container separado.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_read_timeout 60;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\. {
        deny all;
    }
}
