memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 60

; Dados científicos: precisão máxima na serialização de float.
serialize_precision = -1
precision = 17

; Nada de detalhe de erro na resposta — o log é o canal.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; O código é imutável dentro da imagem, então revalidar timestamp é trabalho
; puro: desligar isso é o maior ganho isolado de performance em produção.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Sessão via cookie não é usada pela API (stateless, ADR 0004), mas os
; defaults ficam seguros caso alguma rota web seja adicionada.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
